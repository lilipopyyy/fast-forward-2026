<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Peserta</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard">

        <h1>Dashboard Peserta</h1>

        <p>Data Peserta Fast Forward 2026</p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nama</th>
                    <th>Email</th>
                    <th>Kelas</th>
                    <th>Jurusan</th>
                    <th>Kegiatan</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody id="tabelPeserta">
                <!-- Data peserta akan ditampilkan di sini -->
            </tbody>
        </table>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
