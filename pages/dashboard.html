<!DOCTYPE html>

<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Peserta</title>

    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>
  <div class="dashboard-wrap">

        <div class="dashboard-header">
            <p class="judul-kecil">FAST-FORWARD-2026</p>
            <h1>Dashboard Peserta</h1>
        </div>

        <div class="table-card">

            <div class="table-card-top">
                <h2>Daftar Peserta</h2>
            </div>

            <p id="pesanKosong">Belum ada peserta terdaftar.</p>

            <table id="tabel-peserta">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Email</th>
                        <th>Kelas</th>
                        <th>Jurusan</th>
                        <th>Kegiatan</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="tabelPeserta">
                    <!-- Data peserta akan muncul di sini -->
                </tbody>
            </table>

        </div>

    </div>
</body>
</html>
<script src="../js/script.js"></script>
